server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always
    include-exception: true
  servlet:
    session:
      cookie:
        name: PVSESSION
        http-only: false
        secure: false
        same-site: lax
      timeout: 30d
      persistent: true
  tomcat:
    max-http-form-post-size: 50MB

spring:
  application:
    name: punto-venta-backend

  datasource:
    url: jdbc:mysql://mysql:3306/punto_venta?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: true
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB


app:
  pasarela-api-key: ${PASARELA_API_KEY}
  pasarela-secret: ${PASARELA_SECRET}
  jwt-secret: ${JWT_SECRET}
  smtp-password: ${SMTP_PASSWORD}
  facturacion:
    api-token: ${FACTURACION_API_TOKEN"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.curso.pv: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: /app/logs/punto-venta.log